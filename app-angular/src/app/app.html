<div class="w-[320px] bg-gray-50 min-h-[400px] flex flex-col font-sans text-gray-900">
  <!-- Header -->
  <header class="bg-[#4E76D9] text-white p-5 rounded-b-3xl shadow-md">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <span>✦</span> Yena
      </h1>
      @if (envLabel) {
        <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-white/20 text-white/90">
          {{ envLabel }}
        </span>
      }
    </div>
    <p class="text-[#DCE7FF] text-base mt-1">Candidate Clipper</p>
  </header>

  <!-- Content -->
  <main class="flex-1 p-4 flex flex-col gap-4">
    <!-- Info Section -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 bg-[#E8EFFF] text-[#5F86E5] rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <h2 class="text-base font-semibold text-gray-800">Manual Save</h2>
          <p class="text-sm text-gray-500 mt-0.5">
            Look for the <span class="font-bold text-[#4E76D9]">✦ Yena</span> button on LinkedIn and Sales
            Navigator profiles to save candidates directly.
          </p>
        </div>
      </div>
    </div>

    <!-- Open Dashboard Button -->
    <app-button
      [fullWidth]="true"
      [extraClass]="'bg-[#5F86E5] hover:bg-[#4E76D9] text-white shadow-sm py-2.5'"
      (click)="openDashboard()"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
      Open Yena Dashboard
    </app-button>
  </main>

  <footer class="p-3 text-center text-sm text-gray-400 border-t border-gray-200">
    Yena v{{ version }}
  </footer>
</div>
