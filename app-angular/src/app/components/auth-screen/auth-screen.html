<div
  class="fixed right-0 top-0 h-full w-[400px] bg-[#f7f8fa] text-[#181c25] shadow-2xl flex flex-col font-sans border-l border-[#dde1e8] z-[2147483647] pointer-events-auto overflow-hidden"
>
  <!-- Ambient Background Glow -->
  <div class="absolute top-[-100px] left-[50%] w-[300px] h-[300px] bg-[#ff6a26]/8 blur-[100px] rounded-full pointer-events-none"></div>

  <!-- Header -->
  <div class="relative px-5 py-4 border-b border-[#dde1e8] flex items-center justify-between bg-white/80 backdrop-blur-md z-10">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-[#ff6a26] flex items-center justify-center shadow-sm">
        <img [src]="logoUrl" alt="Yena" class="w-5 h-5 object-contain" />
      </div>
      <span class="font-semibold text-[#181c25] tracking-[-0.02em]">Yena</span>
    </div>
    <button
      (click)="close.emit()"
      class="p-1.5 rounded-md text-[#4a5364] hover:text-[#181c25] hover:bg-black/[0.04] transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="flex-1 flex flex-col items-center justify-center p-8 z-10">
    <div class="w-14 h-14 rounded-xl bg-white shadow-[0px_1px_2px_rgba(0,0,0,0.05),inset_0px_0px_0px_1px_#dde1e8] flex items-center justify-center mb-6">
      <svg class="w-7 h-7 text-[#ff6a26]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
      </svg>
    </div>

    @if (isChecking) {
      <h2 class="text-xl font-semibold text-[#181c25] tracking-[-0.02em] mb-2 text-center">Connecting...</h2>
      <p class="text-base font-medium tracking-[-0.02em] text-[#4a5364] text-center mb-8 max-w-[280px]">
        Checking your authentication status...
      </p>
      <div class="w-6 h-6 border-2 border-[#2563eb] border-t-transparent rounded-full animate-spin"></div>
    } @else {
      <h2 class="text-xl font-semibold text-[#181c25] tracking-[-0.02em] mb-2 text-center">Authentication Required</h2>
      <p class="text-base font-medium tracking-[-0.02em] text-[#4a5364] text-center mb-8 max-w-[280px]">
        Enter your personal API Key from Yena Settings. Do not share API keys if you want correct ownership
        attribution.
      </p>

      <form class="w-full space-y-4" (ngSubmit)="handleConnect()">
        <app-input
          label="API Key"
          type="password"
          placeholder="yena_sk_..."
          extraClass="text-center font-mono"
          [(ngModel)]="apiKey"
          [ngModelOptions]="{ standalone: true }"
        ></app-input>

        @if (authError) {
          <div class="text-sm font-medium tracking-[-0.02em] text-[#dc2626] text-center bg-[#fef2f2] py-2 px-3 rounded-lg border border-[#fecaca]">
            {{ authError }}
          </div>
        }

        <app-button size="lg" variant="primary" [type]="'submit'" [isLoading]="isConnecting" [fullWidth]="true">
          Connect to Yena
        </app-button>
      </form>
    }
  </div>
</div>
