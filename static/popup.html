<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yena</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #272b34;
      --text: #e6e8ec;
      --muted: #8b909a;
      --accent: #4f8cff;
      --ok: #3fb950;
      --err: #f85149;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .header img { width: 20px; height: 20px; }
    .header b { font-size: 14px; }

    .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }

    input {
      width: 100%;
      padding: 9px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active { opacity: 0.85; }

    .status {
      font-size: 12px;
      min-height: 16px;
      color: var(--muted);
    }

    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }

    .hint { font-size: 11px; color: var(--muted); line-height: 1.4; }
  </style>
</head>

<body>
  <div class="header">
    <img src="icons/icon-32.png" alt="" />
    <b>Yena</b>
  </div>

  <div class="body">
    <div>
      <label for="domain">Domain</label>
      <input id="domain" type="url" placeholder="https://app.yena.ai" autocomplete="off" spellcheck="false" />
    </div>

    <div>
      <label for="token">Token</label>
      <input id="token" type="password" placeholder="Your access token" autocomplete="off" spellcheck="false" />
    </div>

    <button id="save">Save</button>
    <div id="status" class="status"></div>

    <div class="hint">
      Set the domain and token. The UI is loaded from the domain and injected into LinkedIn.
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
