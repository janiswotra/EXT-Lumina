<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Yena</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 240px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #181c25;
    }
    .wrap { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
    .wrap img { width: 36px; height: 36px; border-radius: 9px; }
    .name { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .ver { font-size: 12px; color: #687182; margin-top: 3px; }
  </style>
</head>

<body>
  <div class="wrap">
    <img src="icons/icon-128.png" alt="Yena" />
    <div>
      <div class="name">Yena</div>
      <div class="ver" id="ver"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
