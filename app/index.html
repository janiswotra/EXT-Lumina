<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yena Candidate Clipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
          transitionDuration: { 140: '140ms' },
          keyframes: {
            'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            shimmer: { '0%,100%': { opacity: '0.5' }, '50%': { opacity: '1' } },
          },
          animation: { 'fade-in': 'fade-in .15s ease-out', 'fade-in-up': 'fade-in-up .2s ease-out', shimmer: 'shimmer 1.4s ease-in-out infinite' },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="font-sans text-[#181c25]">
  <div id="yena-app"></div>
  <script src="app.js"></script>
</body>
</html>
